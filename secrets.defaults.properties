# Committed placeholders for keys read by the Secrets Gradle plugin.
# Put your real values in local.properties (ignored by Git), for example:
#   MAPS_API_KEY=your-google-maps-key
MAPS_API_KEY=DEFAULT_API_KEY

# Activity Stats backend: the outputs of `npx cdk deploy` in backend/. Blank means sign-in
# isn't set up in this build, and the Account screen says so.
#   COGNITO_DOMAIN=https://<prefix>.auth.<region>.amazoncognito.com   (the SignInUrl output)
#   COGNITO_CLIENT_ID=<AppClientId output>
#   SYNC_API_URL=<ApiUrl output>
COGNITO_DOMAIN=
COGNITO_CLIENT_ID=
SYNC_API_URL=
