# Pushing a v* tag builds the signed release APK and drafts a GitHub release with it.
# The draft is only visible to the owner: smoke-test the APK, then publish it by hand.
# See docs/release.md.
#
# The signing key and the app's settings are secrets of the `release` environment, which
# only v* tags can use and which waits for the owner's approval. Only official actions,
# pinned to exact commits, run next to them, and there is no Gradle cache, so nothing a
# PR run saved can end up in the signed build.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs without secrets, before the approval is asked for.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches versionName
        id: version
        run: |
          version=$(grep -oP '^\s*versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main"
            exit 1
          fi

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # to create the release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The same two files a local release build reads, written to this run's machine only.
      - name: Write signing key and app settings
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          SYNC_API_URL: ${{ secrets.SYNC_API_URL }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
                      MAPS_API_KEY COGNITO_DOMAIN COGNITO_CLIENT_ID SYNC_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name isn't set in the release environment"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          {
            echo "MAPS_API_KEY=$MAPS_API_KEY"
            echo "COGNITO_DOMAIN=$COGNITO_DOMAIN"
            echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
            echo "SYNC_API_URL=$SYNC_API_URL"
          } > local.properties

      - name: Build the release APK
        run: ./gradlew assembleRelease --no-daemon

      # Stops a build signed with the wrong key (or none) from being released.
      - name: Check the signing certificate
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "::error::Variable RELEASE_CERT_SHA256 isn't set"
            exit 1
          fi
          echo "APKs built:"
          ls app/build/outputs/apk/release/
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk wasn't built (an unsigned build is named app-release-unsigned.apk)"
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $build_tools/apksigner"

          # The output stays on this machine. Only the fingerprint, ERROR and WARNING lines are
          # printed: the certificate's name line (DN) may hold a name or place.
          out="$RUNNER_TEMP/apksigner.txt"
          if ! "$build_tools/apksigner" verify --print-certs "$apk" > "$out" 2>&1; then
            grep -E '^(ERROR|WARNING)' "$out" || echo "(no ERROR or WARNING lines)"
            echo "::error::apksigner couldn't verify the APK"
            exit 1
          fi
          grep -i 'certificate SHA-256 digest:' "$out" || true

          # Every signer (normally one) must be the release certificate.
          digests=$(grep -i 'certificate SHA-256 digest:' "$out" | awk '{print tolower($NF)}' | sort -u)
          expected=$(echo "$EXPECTED" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$digests" ]; then
            echo "::error::apksigner printed no SHA-256 certificate digest"
            exit 1
          fi
          if [ "$digests" != "$expected" ]; then
            echo "::error::The APK isn't signed with the certificate in RELEASE_CERT_SHA256"
            exit 1
          fi
          echo "Signed with the expected certificate."

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/activity-stats-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "out/activity-stats-$VERSION.apk" \
            --verify-tag --draft --prerelease --generate-notes --title "$GITHUB_REF_NAME"

      # R8's mapping, to read crash traces from this build. Kept off the release page (it's
      # large); download it from the run within 10 days. Rebuilding the tag gives the same file.
      - name: Save the R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ env.VERSION }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 10
          if-no-files-found: error

      - name: Remove the signing key and settings
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties local.properties
